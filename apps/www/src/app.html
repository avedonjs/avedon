<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090B" />
    <meta
      name="description"
      content="avedon is a TypeScript-first full-stack web framework with .ave components, explicit routing, and hybrid rendering."
    />
    <title>avedon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/favicon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="avedon" />
    <meta property="og:url" content="https://avedon.pages.dev/" />
    <meta property="og:title" content="avedon" />
    <meta
      property="og:description"
      content="avedon is a TypeScript-first full-stack web framework with .ave components, explicit routing, and hybrid rendering."
    />
    <meta property="og:image" content="https://avedon.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="avedon — TypeScript-first full-stack framework" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="avedon" />
    <meta
      name="twitter:description"
      content="avedon is a TypeScript-first full-stack web framework with .ave components, explicit routing, and hybrid rendering."
    />
    <meta name="twitter:image" content="https://avedon.pages.dev/og-image.png" />
    <meta name="twitter:image:alt" content="avedon — TypeScript-first full-stack framework" />
    %avedon.head%
  </head>
  <body>
    <div id="app">%avedon.body%</div>
  </body>
</html>
